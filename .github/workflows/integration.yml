name: Integration (headless plugin)

# End-to-end smoke test of the part unit tests cannot reach: build the C++ host, load real open-source plugins,
# enumerate each parameter catalog, and drive the control socket through the Go client. Two jobs:
#
#   * smoke (macOS)   - the proven, representative host platform (AU is macOS-only). The Surge XT VST3 path is a
#                       HARD assertion; everything newer/unproven is continue-on-error (report-only).
#   * smoke-linux     - the same generic suite on ubuntu under xvfb (headless JUCE plugin hosting needs an X
#                       server even though we never open an editor). Entirely report-only for now.
#
# The generic suite (drive_plugin in .github/scripts/drive_plugin.sh) is catalog-driven and plugin-agnostic: it
# runs against ANY hosted plugin via the SIDECHAIN_SWEEP_* gate (TestFullSurfaceSweep/TestStateRoundTrip/
# TestBatchSetParams, plus TestMidiSmoke for instruments). Best-effort overall: it depends on external downloads
# and real plugin behavior, so a red NEW leg is a signal to investigate, not necessarily a code bug.

on:
  push:
    branches: [main]
    paths: ['cpp/**', '**.go', 'go.mod', 'go.sum', '.github/workflows/integration.yml', '.github/scripts/drive_plugin.sh']
  pull_request:
    paths: ['cpp/**', '**.go', 'go.mod', 'go.sum', '.github/workflows/integration.yml', '.github/scripts/drive_plugin.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  SURGE_VERSION: "1.3.4"
  DEXED_VERSION: "1.0.1"

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Cache JUCE FetchContent
        uses: actions/cache@v6
        with:
          path: cpp/build/_deps
          key: juce-macos-${{ hashFiles('cpp/CMakeLists.txt') }}

      - name: Build C++ host
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --target sidechain-host --config Release

      - name: Cache Surge XT
        id: surge-cache
        uses: actions/cache@v6
        with:
          path: ~/surge
          key: surge-xt-macos-${{ env.SURGE_VERSION }}

      - name: Download Surge XT (pinned, official release)
        if: steps.surge-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/surge
          curl -sSL -o ~/surge/surge.zip \
            "https://github.com/surge-synthesizer/releases-xt/releases/download/${SURGE_VERSION}/surge-xt-macos-${SURGE_VERSION}-pluginsonly.zip"
          # The zip carries both the synth and the effect; extract both (the effect proves NON-synth hosting).
          unzip -qo ~/surge/surge.zip -d ~/surge "Surge XT.vst3/*" "Surge XT Effects.vst3/*"

      # Surge XT VST3 (synth): the proven, hard assertion. Drives the generic gated suite WITH the MIDI smoke.
      - name: Drive Surge XT VST3 (synth) - REQUIRED
        env:
          SIDECHAIN_HOST_BIN: cpp/build/sidechain-host_artefacts/Release/sidechain-host
        run: |
          set -euo pipefail
          source .github/scripts/drive_plugin.sh
          drive_plugin "Surge XT" "$HOME/surge/Surge XT.vst3" 51990 1

      # Surge-specific capability tests: the Phase-1 real-unit inference/inversion path (cutoff exp fit, discrete
      # set-by-label, steep zero-based time curve driving the binary-search refinement). Resolves ids by label
      # against Surge's catalog, so it is Surge-only. Hard assertion (this path is proven).
      - name: Surge capability tests (infer/invert/discrete) - REQUIRED
        run: |
          set -euo pipefail
          HOST="cpp/build/sidechain-host_artefacts/Release/sidechain-host"
          "$HOST" --plugin "$HOME/surge/Surge XT.vst3" --catalog cap.json --port 51991 &
          HOST_PID=$!
          trap 'kill $HOST_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do [ -s cap.json ] && break; sleep 1; done
          test -s cap.json || { echo "host did not write a catalog"; exit 1; }
          pid() { python3 -c "import json,sys; d=json.load(open('cap.json')); print(next(p['id'] for p in d['params'] if p['label']==sys.argv[1]))" "$1"; }
          CUTOFF=$(pid 'A Filter 1 Cutoff')
          DISCRETE=$(pid 'A Osc 1 Type')
          TIME=$(pid 'A Amp EG Attack')
          SIDECHAIN_LIVE_PORT=51991 \
          SIDECHAIN_LIVE_CATALOG=cap.json \
          SIDECHAIN_LIVE_PARAM="$CUTOFF" \
          SIDECHAIN_LIVE_DISCRETE="$DISCRETE" \
          SIDECHAIN_LIVE_TIME="$TIME" \
            go test -run 'TestWiredLive|TestInferLive|TestE2ESurgeExtras' -v .

      # Surge XT EFFECTS VST3 (REQUIRED on macOS): proves the SAME generic surface drives a NON-synth. Run WITHOUT
      # the MIDI smoke (an effect has no MIDI in). Promoted after the state round-trip moved to the fresh-load
      # pass: green across confirming runs on macOS (13/13 restored). The Linux effect leg stays report-only (it
      # does not restore state headless there).
      - name: Drive Surge XT Effects VST3 (effect, no MIDI) - REQUIRED
        env:
          SIDECHAIN_HOST_BIN: cpp/build/sidechain-host_artefacts/Release/sidechain-host
        run: |
          set -euo pipefail
          source .github/scripts/drive_plugin.sh
          drive_plugin "Surge XT Effects" "$HOME/surge/Surge XT Effects.vst3" 51992 0

      # AU (.component / AudioUnit) load+drive smoke - REQUIRED on macOS (promoted after several green runs: the
      # Apple-AU-by-identifier load is deterministic on the runner).
      #
      # We drive an APPLE BUILT-IN AU by component identifier ("AudioUnit:Effects/aufx,dcmp,appl" =
      # AUDynamicsProcessor). On macOS an AU is resolved through the system AudioComponent registry
      # (AudioComponentFindNext), NOT by scanning a path: a third-party .component only loads once it is installed
      # under ~/Library/Audio/Plug-Ins/Components AND registered by AudioComponentRegistrar, which is unreliable on
      # a headless runner. Apple's own units are always registered, so an identifier is the deterministic AU load.
      # (We still try Surge's .component by path first, purely to record on CI whether an unregistered path load
      # works on the runner - a failure there is expected and does not fail this step.)
      - name: Load and drive an AU - REQUIRED
        run: |
          set -euo pipefail
          HOST="cpp/build/sidechain-host_artefacts/Release/sidechain-host"

          # Informational: does an unregistered third-party .component load by path on this runner? Extract Surge's
          # AU from the already-downloaded zip and try. Expected to fail (not registered) - do not gate on it.
          unzip -qo ~/surge/surge.zip -d ~/surge "Surge XT.component/*" || true
          if [ -d "$HOME/surge/Surge XT.component" ]; then
            echo "--- probing Surge XT.component load-by-path (informational) ---"
            "$HOST" --plugin "$HOME/surge/Surge XT.component" --catalog surge-au.json --port 52001 2>surge-au.log &
            SPID=$!
            for i in $(seq 1 10); do [ -s surge-au.json ] && break; sleep 1; done
            if [ -s surge-au.json ]; then
              echo "load-by-path SUCCEEDED (component is registered on this runner): $(python3 -c "import json;print(json.load(open('surge-au.json'))['count'])") params"
            else
              echo "load-by-path did not enumerate (expected if unregistered):"; cat surge-au.log || true
            fi
            kill $SPID 2>/dev/null || true
          fi

          # The real smoke: load an Apple AU by identifier, enumerate its catalog, and drive it over the socket.
          echo "--- AU load+drive: AUDynamicsProcessor by identifier ---"
          "$HOST" --plugin "AudioUnit:Effects/aufx,dcmp,appl" --catalog aucat.json --port 52000 &
          AU_PID=$!
          trap 'kill $AU_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do [ -s aucat.json ] && break; sleep 1; done
          test -s aucat.json || { echo "AU host did not write a catalog (AU load failed)"; exit 1; }
          AU_COUNT=$(python3 -c "import json; print(json.load(open('aucat.json'))['count'])")
          echo "AU enumerated $AU_COUNT params"
          [ "$AU_COUNT" -gt 0 ] || { echo "AU enumerated zero params"; exit 1; }
          AU_PARAM=$(python3 -c "import json; print(json.load(open('aucat.json'))['params'][0]['id'])")
          SIDECHAIN_AU_PORT=52000 \
          SIDECHAIN_AU_CATALOG=aucat.json \
          SIDECHAIN_AU_PARAM="$AU_PARAM" \
            go test -run 'TestAULive' -v .

      # Concurrency (docs/CONCURRENCY.md): several controllers drive ONE host at once. C1 = independent concurrent
      # control; C2 = one controller's change is pushed to another as a param_changed event; C3 = the governed
      # conflict tier (lease/mode/gate, applied/compensated/rejected) with governed_changed events. All run against
      # one Surge host. REQUIRED: the multi-controller substrate is a load-bearing product property.
      - name: Concurrency C1 + C2 + C3 (multi-controller, change + governed events) - REQUIRED
        run: |
          set -euo pipefail
          HOST="cpp/build/sidechain-host_artefacts/Release/sidechain-host"
          "$HOST" --plugin "$HOME/surge/Surge XT.vst3" --catalog mc.json --port 52010 &
          MC_PID=$!
          trap 'kill $MC_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do [ -s mc.json ] && break; sleep 1; done
          test -s mc.json || { echo "host did not write a catalog"; exit 1; }
          SIDECHAIN_SWEEP_PORT=52010 SIDECHAIN_SWEEP_CATALOG=mc.json \
            go test -run 'TestMultiClientLive|TestChangeNotifications|TestGovernedLive|TestGovernedToolsLive|TestGovernedDisconnectFreesLease' -v .

  # ---------------------------------------------------------------------------------------------------------------
  # Linux leg. Headless JUCE VST3 hosting under xvfb-run (a plugin touches X at construction even with no editor).
  # REQUIRED, with Surge XT + TAL + Dexed gating the pipeline (all green across confirming runs). Only the Surge
  # Effects leg stays report-only: it hosts and drives fine under xvfb but its state round-trip does not restore
  # headless on Linux (the macOS Effects leg does). All steps run regardless of prior failures (if: !cancelled())
  # so every plugin reports each run.
  smoke-linux:
    runs-on: ubuntu-latest
    env:
      # JUCE writes the artefact under the $<CONFIG> subdir even on single-config generators when
      # CMAKE_BUILD_TYPE is set, so the Linux path has the same Release/ segment as macOS (the earlier
      # no-Release path caused "sidechain-host: not found" under xvfb-run).
      SIDECHAIN_HOST_BIN: cpp/build/sidechain-host_artefacts/Release/sidechain-host
      SIDECHAIN_XVFB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install Linux JUCE deps + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            xvfb

      - name: Cache JUCE FetchContent
        uses: actions/cache@v6
        with:
          path: cpp/build/_deps
          key: juce-linux-${{ hashFiles('cpp/CMakeLists.txt') }}

      - name: Build C++ host
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --target sidechain-host --config Release

      # Download the LINUX VST3 builds of every plugin. All URLs verified with gh api / curl -sI before pinning.
      - name: Cache plugin downloads
        id: plug-cache
        uses: actions/cache@v6
        with:
          path: ~/plugins
          key: linux-plugins-surge${{ env.SURGE_VERSION }}-dexed${{ env.DEXED_VERSION }}-talNM-v1

      - name: Download Linux plugins
        if: steps.plug-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/plugins && cd ~/plugins

          # Surge XT (synth) + Surge XT Effects (effect), one tarball, both VST3 bundles.
          curl -sSL -o surge.tar.gz \
            "https://github.com/surge-synthesizer/releases-xt/releases/download/${SURGE_VERSION}/surge-xt-linux-${SURGE_VERSION}-pluginsonly.tar.gz"
          tar xzf surge.tar.gz "./Surge XT.vst3" "./Surge XT Effects.vst3"

          # TAL-NoiseMaker (synth). The zip nests the bundle under a TAL-NoiseMaker/ dir; flatten it out.
          curl -sSL -o tal.zip "https://tal-software.com/downloads/plugins/TAL-NoiseMaker_64_linux.zip"
          unzip -qo tal.zip
          mv "TAL-NoiseMaker/TAL-NoiseMaker.vst3" .

          # Dexed (FM synth). The macOS release ships only an AU, so Dexed is Linux-only here.
          curl -sSL -o dexed.zip \
            "https://github.com/asb2m10/dexed/releases/download/v${DEXED_VERSION}/Dexed-${DEXED_VERSION}-lnx.zip"
          unzip -qo dexed.zip "Dexed.vst3/*"

          ls -la ~/plugins

      # One host build; loop the plugins. Each drive is its own step, and all run regardless of prior-step outcome
      # (if: !cancelled()) so every plugin reports each run. Surge XT + TAL + Dexed are REQUIRED; only the Surge
      # Effects leg keeps step-level continue-on-error (Linux state round-trip). Host runs under xvfb-run -a.
      - name: Drive Surge XT VST3 (synth) - REQUIRED
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          source .github/scripts/drive_plugin.sh
          drive_plugin "Surge XT" "$HOME/plugins/Surge XT.vst3" 51990 1

      - name: Drive TAL-NoiseMaker VST3 (synth) - REQUIRED
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          source .github/scripts/drive_plugin.sh
          drive_plugin "TAL-NoiseMaker" "$HOME/plugins/TAL-NoiseMaker.vst3" 51991 1

      # Flat-plugin section leases (C3): TAL exposes NO parameter-tree groups, so the host derives leasable sections
      # from shared label prefixes (JucePluginBridge, a port of sections.go). This exercises that fallback end to
      # end: assert the derivation is non-empty (regression-to-empty fails here), then drive group-bound leases on
      # the derived sections. Report-only for now (new).
      - name: Flat-plugin section leases (label-prefix derivation, TAL) - report-only
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          xvfb-run -a "$SIDECHAIN_HOST_BIN" --plugin "$HOME/plugins/TAL-NoiseMaker.vst3" --catalog talgov.json --port 52020 >host-talgov.log 2>&1 &
          HP=$!
          trap 'kill $HP 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do [ -s talgov.json ] && break; sleep 1; done
          test -s talgov.json || { echo "host did not write a catalog"; cat host-talgov.log; exit 1; }
          python3 -c '
          import socket, json, sys
          s = socket.create_connection(("127.0.0.1", 52020), 3); f = s.makefile("rwb")
          def req(o):
              f.write((json.dumps(o) + "\n").encode()); f.flush()
              while True:
                  m = json.loads(f.readline())
                  if "event" not in m: return m
          req({"cmd": "ping", "id": 1})
          secs = req({"cmd": "get_governed", "id": 2}).get("sections") or []
          print("derived sections:", secs)
          sys.exit(0 if len(secs) >= 2 else 1)
          '
          SIDECHAIN_SWEEP_PORT=52020 SIDECHAIN_SWEEP_CATALOG=talgov.json \
            go test -run 'TestGovernedLive|TestGovernedDisconnectFreesLease' -v .

      # Dexed (REQUIRED): now green on Linux after the state round-trip moved to the fresh-load pass. Its earlier
      # failure was the same sweep-churn artifact as Surge Effects, not async state as first suspected (15/15
      # restored across confirming runs).
      - name: Drive Dexed VST3 (FM synth) - REQUIRED
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          source .github/scripts/drive_plugin.sh
          drive_plugin "Dexed" "$HOME/plugins/Dexed.vst3" 51992 1

      # Surge Effects on LINUX (report-only): loads and drives fine under xvfb, but its state round-trip does not
      # restore headless here (9/13 moved params), even from a fresh load - a platform-specific quirk (the macOS
      # Effects leg restores 13/13 and is required). Kept report-only until the Linux state issue is understood.
      - name: Drive Surge XT Effects VST3 (effect, no MIDI) - report-only
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          source .github/scripts/drive_plugin.sh
          drive_plugin "Surge XT Effects" "$HOME/plugins/Surge XT Effects.vst3" 51993 0
