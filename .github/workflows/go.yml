name: Go

# Build, vet, format-check, and test the Go MCP layer on every push and PR. This is the fast, always-green
# gate; the C++ host build (cpp.yml) and the plugin integration smoke test (integration.yml) are separate and
# heavier.

on:
  push:
    branches: [main]
    paths: ['**.go', 'go.mod', 'go.sum', '.github/workflows/go.yml']
  pull_request:
    paths: ['**.go', 'go.mod', 'go.sum', '.github/workflows/go.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean (run 'gofmt -w .'):"
            echo "$unformatted"
            exit 1
          fi

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "go.mod/go.sum not tidy; run 'go mod tidy'"; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=cover.out ./...

      - name: Coverage summary + floor (>= 90%)
        run: |
          # Measure the LIBRARY package only. cmd/sidechain/main.go is a thin CLI shim (flag parsing + a Run call)
          # that is deliberately untested; including its 0% would drag the weighted total below the floor and punish
          # the wrong thing. Filter it out of the profile before computing the total (the "mode:" line has no path,
          # so grep -v keeps it).
          grep -v 'mcp-vst-sidechain/cmd/' cover.out > cover.lib.out
          go tool cover -func=cover.lib.out | tail -1
          echo '### Go coverage (library package)' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.lib.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          pct=$(go tool cover -func=cover.lib.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "library statement coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 90.0) ? 0 : 1 }' || {
            echo "::error::Go library coverage ${pct}% is below the 90% floor (add unit tests; see docs/TESTING.md)"
            exit 1
          }

  # Required gate: staticcheck is clean today, and pinned so a new release cannot red the build unexpectedly.
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  # Report-only: govulncheck's findings here are dominated by Go stdlib CVEs fixed in newer patch releases, so
  # making it required would red the build on toolchain-version drift rather than on our code. Watch its output
  # and bump the Go toolchain (or a dependency) when it flags something we actually call.
  govulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
