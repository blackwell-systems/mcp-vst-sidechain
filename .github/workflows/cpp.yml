name: C++ host (best-effort)

# Configure and build the JUCE host. This fetches JUCE via FetchContent on a cold cache, so it is heavy: it
# runs on demand and on pushes that touch the C++ sources, not on every commit. VST3 hosting builds on all
# platforms; AU is macOS only. This gate is best-effort: JUCE upstream changes can break a cold configure.

on:
  push:
    branches: [main]
    paths: ['cpp/**', '.github/workflows/cpp.yml']
  pull_request:
    paths: ['cpp/**', '.github/workflows/cpp.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, JUCE-free unit test of the pure label-prefix section derivation (cpp/SectionDerivation.h). It compiles
  # in a second with the system compiler (no JUCE fetch, no plugin), so unlike the best-effort host build below it
  # is a reliable, deterministic gate. Mirrors the Go sections_test.go cases; the gated Go TestSectionLockstep
  # separately proves the host's emitted sections match the Go reference on real plugins.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run section-derivation-test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -o sdt cpp/tests/section_derivation_test.cpp
          ./sdt
      - name: Build and run render-analysis-test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -o rat cpp/tests/render_analysis_test.cpp
          ./rat

  build:
    strategy:
      fail-fast: false
      matrix:
        # VST3 hosting builds on all three platforms; AU is macOS only (the
        # JUCE_PLUGINHOST_AU define is a no-op elsewhere). fail-fast:false keeps
        # a single leg failing from redding the others (this gate is best-effort).
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux JUCE deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev

      - name: Cache JUCE FetchContent
        uses: actions/cache@v6
        with:
          path: cpp/build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}

      - name: Configure
        # CMAKE_EXPORT_COMPILE_COMMANDS gives clang-tidy the exact flags (JUCE
        # include paths, defines) for our two translation units.
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build cpp/build --target sidechain-host --config Release

      # Report-only lint of OUR sources only (--header-filter restricted to cpp/ so JUCE's own headers, which ship
      # their own .clang-tidy, are not linted; -p reads the compile database). Kept report-only INTENTIONALLY: the
      # clang-tidy version on the runner image drifts and a bump can surface new findings on unchanged code. The
      # hard C++ gate is the compiler warnings-as-errors: the Build step above compiles main.cpp/Host.cpp with
      # -Werror (see cpp/CMakeLists.txt, scoped to our two TUs so JUCE's own non-clean module sources are exempt),
      # so a warning in our code fails the required build. --extra-arg=-Wno-error keeps that source -Werror from
      # tripping clang-tidy's own parse on a JUCE-header compiler warning.
      - name: clang-tidy (report-only)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          clang-tidy --version
          clang-tidy -p cpp/build \
            --header-filter='(^|/)cpp/' \
            --extra-arg=-Wno-error \
            cpp/main.cpp cpp/Host.cpp
